<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Card</title>
  <link rel="stylesheet" href="css.stylee.css">
</head>
<body>
<div class="card">
  <div class="front">
    Bill Gates
  </div>

  <div class="back">
    <div class="top">
      <img src="https://avatars.mds.yandex.net/i?id=f02df523e150462e5bbb734d7f6ec3fbfdacbf77-5288046-images-thumbs&n=13" alt="Bill Gates">
    </div>
    <div class="info">
      <h1 class="name">Bill Gates</h1>
      <p><b>Age:</b> 65</p>
      <p><b>Job:</b> programmer, director, others</p>
      <p><b>Company:</b> Microsoft</p>
    </div>
  </div>
</div>
</body>
</html>
