name: Saytlarni GitHub Pages-ga yuklash

on:
  push:
    branches: [master]
    paths: ['1sayt/**', 'racing-game/**', 'math-calculator.html', 'matematika-sayti/index.html', 'matematika-sayti/app.js', 'matematika-sayti/styles.css', 'matematika-sayti/styles.min.css', 'matematika-sayti/data/questions.js', '.github/workflows/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sayt va o'yinni tayyorlash
        run: |
          mkdir -p public/matematika-sayti/data
          cp -r 1sayt/* public/
          cp -r racing-game public/racing-game
          cp math-calculator.html public/
          cp matematika-sayti/index.html matematika-sayti/app.js matematika-sayti/styles.css matematika-sayti/styles.min.css public/matematika-sayti/
          cp matematika-sayti/data/questions.js public/matematika-sayti/data/

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
